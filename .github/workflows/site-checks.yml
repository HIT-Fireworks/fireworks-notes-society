name: Site contract checks
on:
  pull_request:
    paths:
      - '.vitepress/**'
      - 'edge-functions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/course-groups.v1.json'
      - 'config/repository-*.v4.json'
      - 'data/repository-manifest.no-collection.v4.json'
      - 'data/.fireworks-json/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.*.mts'
      - '.github/workflows/site-checks.yml'
      - 'config/registry-checks.workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Verify course and resource tree contracts
        run: bun test scripts/course-catalog.test.mts scripts/course-page-build.test.mts scripts/resource-tree.test.mts scripts/manifest-store.test.mts
      - name: Verify Registry and migration contracts
        run: python3 -m unittest tests.test_registry_repository_routes tests.test_repository_description tests.test_repository_cutover_hardening
