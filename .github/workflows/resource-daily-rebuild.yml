name: Daily resource rebuild
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-daily-build
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - name: Check resource heads and markers
        env:
          RESOURCE_GITHUB_TOKEN: ${{ secrets.RESOURCE_GITHUB_TOKEN || github.token }}
          RESOURCE_STATUS_SECRET: ${{ secrets.RESOURCE_STATUS_SECRET }}
          EDGEONE_DEPLOY_WEBHOOK_URL: ${{ secrets.EDGEONE_DEPLOY_WEBHOOK_URL }}
          SITE_ORIGIN: https://fireworks.jwyihao.top
        run: bun scripts/check-resource-dirty.mts
